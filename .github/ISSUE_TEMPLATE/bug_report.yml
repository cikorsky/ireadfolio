name: Bug report / 问题反馈
description: Report a reproducible problem using public or synthetic content.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please use public or synthetic content. Do not attach passwords, cookies, browser-storage exports, private documents, or access-granting URL parameters.
        Security vulnerabilities should follow SECURITY.md rather than a public issue.
  - type: input
    id: version
    attributes:
      label: Extension version / 扩展版本
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / 浏览器
      options:
        - Chrome
        - Edge
        - Firefox
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser version and operating system / 浏览器版本及操作系统
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include a shareable public URL or a minimal synthetic example when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Explain what happened. For exports, name the format and the software used to open it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 已脱敏的证据
      description: Optional logs or screenshots. Remove personal content and credentials first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I have removed credentials, private content, and access-granting links from this report.
          required: true
